name: Update profile activity

on:
  schedule:
    - cron: '17 7 * * *'      # daily 07:17 UTC, after ltcma's 06:00 refresh lands
  workflow_dispatch:           # allow manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate "Recent activity" from ltcma commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile_readme.py

      - name: Commit if the section changed
        run: |
          git config user.name  "profile-readme-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: refresh recent activity"
          git push
